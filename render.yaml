databases:
  - name: queueflow-db
    plan: free
    databaseName: queueflow
    user: queueflow

services:
  - type: web
    name: queueflow-mai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queueflow-db
          property: connectionString
      - key: CORS_ORIGINS
        value: ""
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: TIMEZONE
        value: Europe/Moscow
